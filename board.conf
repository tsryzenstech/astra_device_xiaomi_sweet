# astraOS board configuration - Xiaomi Redmi Note 10 Pro (sweet / sweetin)
# Sourced by build.sh and every script in scripts/. Override any value from
# the environment, e.g. ASTRA_REF=dev ./build.sh

DEVICE=sweet
DEVICE_CODENAMES="sweet sweetin"
DEVICE_MODEL="Redmi Note 10 Pro"
DEVICE_BRAND=Redmi
DEVICE_MANUFACTURER=Xiaomi
SOC=sm7150

# ---- Sources ---------------------------------------------------------------
# astraOS system code. ASTRA_SRC (a local checkout) wins over the git remote.
: "${ASTRA_REPO:=https://github.com/tsryzenstech/astra.git}"
: "${ASTRA_REF:=main}"
: "${ASTRA_SRC:=}"

# Everything below is pinned to a commit or a checksum, never a branch that can
# move, so that two builds are the same.

# Kernel. "prebuilt" (default) takes the package in kernel/prebuilt:
# sm7150-mainline v7.1_rc3 as packaged by postmarketOS (image, device tree and
# modules). "source" builds sm7150-mainline from KERNEL_REPO/KERNEL_REF instead.
: "${KERNEL_SOURCE:=prebuilt}"
KERNEL_PACKAGE=kernel/prebuilt/linux-postmarketos-qcom-sm7150-7.1_rc3-r0.apk
KERNEL_PACKAGE_SHA256=7263bd3c9b98ad91aa25882e3bd71e7064eea18a3612243fbbef8185adbd42aa
KERNEL_RELEASE=7.1.0-rc3-sm7150

# Mainline Linux for SM7150 (sm7150-xiaomi-sweet.dts lives there).
: "${KERNEL_REPO:=https://github.com/sm7150-mainline/linux.git}"
: "${KERNEL_REF:=v7.1_rc3}"
KERNEL_CONFIGS="defconfig sm7150.config"
KERNEL_DTB=qcom/sm7150-xiaomi-sweet.dtb

# Bootloader: astraOS's U-Boot (sm7150-mainline's, silent, without logos),
# flashed to boot. It starts astraOS from the EFI partition in userdata.img.
: "${UBOOT_REPO=https://github.com/tsryzenstech/u-boot.git}"
: "${UBOOT_REF:=cd92b823af132092251142046d9a73da91858ba4}"
UBOOT_DTB=qcom/sm7150-xiaomi-sweet

# Device firmware (non-free, downloaded at build time, never committed).
: "${FIRMWARE_REPO:=https://github.com/sm7150-mainline/firmware-xiaomi-sweet.git}"
: "${FIRMWARE_REF:=5a42e6546fc748a12a59d3f9e72be4a53e8dd931}"
# The speaker amplifiers' calibration, from MIUI V13.0.15.0.SKFMIXM (Global): it is
# specific to this phone and not in the firmware above. A single data file.
: "${AW_ACF_URL:=https://raw.githubusercontent.com/TheMuppets/proprietary_vendor_xiaomi_sweet/741bcfb5293d12c622fc9dddc082330c60417d9a/proprietary/vendor/firmware/awinic/aw882xx_pid_2032_acf.bin}"
: "${AW_ACF_SHA256:=691695219f7367d0b8fa35337a7c6cb4ff983987e554aa9313755de1d36ed051}"

# What brings the modem up, and Wi-Fi with it (not packaged by Alpine).
: "${RMTFS_REPO:=https://github.com/linux-msm/rmtfs.git}"
: "${RMTFS_REF:=b30a3eb38f9af283f18dbd3c7755653efc52c094}"
: "${TQFTPSERV_REPO:=https://github.com/linux-msm/tqftpserv.git}"
: "${TQFTPSERV_REF:=eb4b9a04ff92d2753ededf32cc3b6ed287f6e29b}"

# Userland libraries (musl, Qt 6, Mesa...) come from Alpine Linux packages,
# at the versions of packages.lock.
: "${ALPINE_BRANCH:=v3.22}"
: "${ALPINE_MIRROR:=https://dl-cdn.alpinelinux.org/alpine}"

# ---- boot.img (stock Xiaomi ABL, boot image header v2 with DTB) -------------
BOOT_HEADER_VERSION=2
BOOT_BASE=0x00000000
BOOT_PAGESIZE=4096
BOOT_KERNEL_OFFSET=0x00008000
BOOT_RAMDISK_OFFSET=0x01000000
BOOT_TAGS_OFFSET=0x00000100
BOOT_DTB_OFFSET=0x01f00000
BOOT_OS_VERSION=13.0.0
BOOT_OS_PATCH_LEVEL=2023-11
# Boot messages go to the screen (simple framebuffer) with a readable font;
# init quiets the console once the system partition is mounted.
# No console: as postmarketOS does on sweet (console=null), the debug UART is
# wired as SPI, and printing the kernel log on the command-mode panel's
# framebuffer console hangs the boot right after the display driver takes
# over (then the watchdog restarts the phone). The whole log still goes to
# ramoops (/sys/fs/pstore after a reboot, or "Show the last boot log" in
# astraOS's U-Boot), hence loglevel=7, and astra.verbose keeps the
# services' own output (SysBoard, astrad) in it.
BOOT_CMDLINE="console=null loglevel=7 astra.verbose printk.devkmsg=on firmware_class.path=/vendor/firmware"

# ---- Dynamic partitions (super) ---------------------------------------------
SUPER_SIZE=9126805504
SUPER_GROUP=qti_dynamic_partitions
SUPER_GROUP_SIZE=9122611200
SUPER_METADATA_SIZE=65536
SUPER_METADATA_SLOTS=2
SUPER_PARTITIONS="system vendor product"

# Free space left inside each filesystem image, in MiB.
IMAGE_HEADROOM_MB=96

# UI scale: 1080 x 2400 panel -> ~393 x 873 logical pixels.
UI_SCALE=2.75
# UFS logical block size (GPT and FAT of userdata.img for U-Boot).
STORAGE_SECTOR_SIZE=4096
# One rate only: a modeset to another puts back the DSI setting of sweet.rc (and
# 60 Hz was garbage on the phone, though maybe for that same reason).
DISPLAY_REFRESH=120
# Motion blur in app animations costs a full-screen blur per frame: off on
# this GPU (Adreno 618) so launches stay smooth. Maintainers decide per device.
MOTION_BLUR=false
