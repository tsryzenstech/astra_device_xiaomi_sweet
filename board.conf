# astraOS board configuration - Xiaomi Redmi Note 10 Pro (sweet / sweetin)
# Sourced by build.sh and every script in scripts/. Override any value from
# the environment, e.g. ASTRA_REF=dev ./build.sh

DEVICE=sweet
DEVICE_CODENAMES="sweet sweetin"
DEVICE_MODEL="Redmi Note 10 Pro"
DEVICE_BRAND=Redmi
DEVICE_MANUFACTURER=Xiaomi
SOC=sm7150

# ---- Sources ---------------------------------------------------------------
# astraOS system code. ASTRA_SRC (a local checkout) wins over the git remote.
: "${ASTRA_REPO:=https://github.com/tsryzenstech/astra.git}"
: "${ASTRA_REF:=main}"
: "${ASTRA_SRC:=}"

# ---- postmarketOS (now named Nura) -----------------------------------------
# astraOS runs on postmarketOS: its kernel, initramfs, firmware, device
# support and base system, installed with pmbootstrap as postmarketOS
# installs itself on this phone. sweet is one of the "qcom-sm7150" devices.
: "${PMOS_CHANNEL:=v26.06}"            # postmarketOS release (based on Alpine v3.24)
: "${PMOS_DEVICE:=qcom-sm7150}"
: "${PMB_REPO:=https://gitlab.nura.eco/nura/pmbootstrap.git}"
: "${PMB_REF:=3.12.1}"

# astraOS itself is built against the Alpine release postmarketOS is based
# on, so it uses the same libraries (Qt 6, Mesa...) the phone runs.
: "${ALPINE_BRANCH:=v3.24}"
: "${ALPINE_MIRROR:=https://dl-cdn.alpinelinux.org/alpine}"

# Mesa. Alpine v3.24's Mesa 26.1.6 crashes on this phone's Adreno 618 the
# first time any program compiles a shader (nir_algebraic_automaton in
# libgallium: SysBoard, kmscube...). The image gets Mesa from Alpine v3.22
# instead: 25.1.9, the version astraOS showed its UI with on sweet (same
# kernel). Only Mesa's own packages and the LLVM they use; nothing else
# depends on Mesa's version. MESA_PIN_BRANCH= keeps postmarketOS's Mesa.
: "${MESA_PIN_BRANCH=v3.22}"
MESA_PIN_VERSION=25.1.9-r0
MESA_PIN_EXTRA="llvm20-libs-20.1.8-r0"

# Bootloader: astraOS's U-Boot (sm7150-mainline's, as postmarketOS uses on
# this phone, but silent and without logos), flashed to boot. It starts
# postmarketOS's systemd-boot from the image in userdata.
: "${UBOOT_REPO=https://github.com/tsryzenstech/u-boot.git}"
: "${UBOOT_REF:=astra}"
UBOOT_DTB=qcom/sm7150-xiaomi-sweet

# ---- Boot ------------------------------------------------------------------
# Added to postmarketOS's kernel command line (which has "quiet").
# console=null: nothing on the screen - printing to the framebuffer console
# of sweet's command-mode panel can hang the boot (and the watchdog then
# restarts the phone). The only console left is ramoops, the boot log U-Boot
# shows ("Show the last boot log"): ignore_loglevel puts every message in it
# (with a log level, ramoops would keep only errors), printk.devkmsg=on also
# astraOS's own messages. No blinking cursor.
KERNEL_CMDLINE="console=null ignore_loglevel printk.devkmsg=on vt.global_cursor_default=0"

# ---- astraOS ---------------------------------------------------------------
# UI scale: 1080 x 2400 panel -> ~393 x 873 logical pixels.
UI_SCALE=2.75
# Motion blur in app animations costs a full-screen blur per frame: off on
# this GPU (Adreno 618) so launches stay smooth. Maintainers decide per device.
MOTION_BLUR=false
