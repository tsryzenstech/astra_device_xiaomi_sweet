# Redmi Note 10 Pro (sweet): two AW88263S amplifiers on the primary MI2S, the
# aw88261 driver with the calibration scripts/acffix.py corrects.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		# The driver adds this control to the bits of the boost current limit on
		# this chip: it stays at the calibrated level, PipeWire sets the volume.
		cset "name='Speaker PCM Playback Volume' 0"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
