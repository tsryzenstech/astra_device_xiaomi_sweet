name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sweet:
    # Native arm64: the whole build (kernel, Qt apps, images) runs without emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: astra_device_xiaomi_sweet

      # A private astra repository needs a token that can read it: add a
      # fine-grained personal access token as the ASTRA_REPO_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: tsryzenstech/astra
          path: astra
          token: ${{ secrets.ASTRA_REPO_TOKEN || github.token }}

      - name: Build
        working-directory: astra_device_xiaomi_sweet
        run: ./build.sh --docker all

      - uses: actions/upload-artifact@v4
        with:
          name: astraOS-sweet
          path: astra_device_xiaomi_sweet/out/*.zip
          if-no-files-found: error
