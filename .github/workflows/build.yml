# Builds astraOS for sweet and publishes it on GitHub (see astra's
# docs/VERSIONING.md):
#
#   automatic builds -> pre-release "<version>-rev<N>" (27.0-rev1, 27.0-rev2...),
#     the phones' "prerelease" update channel
#     a new astraOS version (astra's "version" workflow sends astra-version;
#     the scheduled check catches a version that has no build yet), or a
#     push to this repository
#   manual builds (Actions > build > Run workflow) -> release "<version>"
#     ("<version>-rev<N>" once "<version>" exists), marked as the latest: the
#     phones' "stable" update channel
#
# Each build also publishes what the phones download to update themselves
# (super.img.gz, esp.fat.gz) and ota.json, which describes it with the changes
# since the previous build of its channel.
#
# The maintainer can also turn a pre-release into a release on GitHub.
# Every build's zip is also an artifact of its workflow run.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  repository_dispatch:
    types: [astra-version]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: each takes the next -rev number.
concurrency:
  group: sweet-builds
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      suffix: ${{ steps.plan.outputs.suffix }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      channel: ${{ steps.plan.outputs.channel }}
      time: ${{ steps.plan.outputs.time }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A private astra repository needs a token that can read it: add a
      # fine-grained personal access token as the ASTRA_REPO_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: tsryzenstech/astra
          path: astra
          token: ${{ secrets.ASTRA_REPO_TOKEN || github.token }}
          sparse-checkout: version.json
          sparse-checkout-cone-mode: false
      - name: Version and tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(python3 -c '
          import json
          v = json.load(open("astra/version.json"))
          letter = {"alpha": "a", "beta": "b", "delta": "d", "stable": ""}[v["channel"]]
          print("%s.%s%s" % (v["major"], v["minor"], letter))')
          git fetch --tags --force -q
          re=$(printf '%s' "$version" | sed 's/[.]/\\./g')
          last=$(git tag -l "$version-rev*" | sed -n "s/^$re-rev\([0-9][0-9]*\)\$/\1/p" | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          released=$(git tag -l "$version")

          build=true
          if [ "$EVENT" = schedule ] && { [ -n "$last" ] || [ -n "$released" ]; }; then
              build=false   # this version has builds already
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
              prerelease=false
              if [ -z "$released" ]; then tag=$version suffix=""; else tag=$version-rev$next suffix=-rev$next; fi
          else
              prerelease=true tag=$version-rev$next suffix=-rev$next
          fi
          channel=stable
          [ "$prerelease" = true ] && channel=prerelease
          echo "astraOS $version: build=$build tag=$tag channel=$channel"
          {
              echo "build=$build"
              echo "version=$version"
              echo "tag=$tag"
              echo "suffix=$suffix"
              echo "prerelease=$prerelease"
              echo "channel=$channel"
              echo "time=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

  sweet:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # Native arm64: Alpine's aarch64 build image runs without emulation.
    runs-on: ubuntu-24.04-arm
    env:
      ASTRA_VERSION_SUFFIX: ${{ needs.plan.outputs.suffix }}
    steps:
      # The whole history of both: the changelog lists the commits since the
      # previous build.
      - uses: actions/checkout@v4
        with:
          path: astra_device_xiaomi_sweet
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: tsryzenstech/astra
          path: astra
          token: ${{ secrets.ASTRA_REPO_TOKEN || github.token }}
          fetch-depth: 0

      - name: Release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 astra_device_xiaomi_sweet/scripts/release-notes.py "${{ needs.plan.outputs.tag }}" \
              "${{ needs.plan.outputs.channel }}" "${{ needs.plan.outputs.time }}" \
              astra astra_device_xiaomi_sweet astra_device_xiaomi_sweet/release.json

      # Stops before packaging when scripts/verify.py finds a problem.
      - name: Build and verify
        working-directory: astra_device_xiaomi_sweet
        run: |
          set -o pipefail
          ./build.sh --docker all 2>&1 | tee build.log

      # The end of the log, where a failed build says why, in the run's summary:
      # anyone can read it there, the full log needs a GitHub account.
      - name: Why the build failed
        if: failure()
        working-directory: astra_device_xiaomi_sweet
        run: |
          [ -f build.log ] || exit 0
          { echo '### Build log (last 120 lines)'; echo '```'; tail -n 120 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Also as an annotation, which the API gives without signing in.
          tail -n 60 build.log | cut -c1-300 | python3 -c 'import sys; t = sys.stdin.read().replace("%", "%25").replace("\r", "").replace("\n", "%0A"); print("::error title=Build log::" + t)'

      - name: Verification report
        if: always()
        working-directory: astra_device_xiaomi_sweet
        run: |
          [ -f out/verify.txt ] || exit 0
          { echo '```'; cat out/verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: astraOS-${{ needs.plan.outputs.tag }}-sweet
          path: astra_device_xiaomi_sweet/out/*.zip
          if-no-files-found: error

      - name: Release notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          EVENT: ${{ github.event_name }}
        run: |
          kind="Release (stable channel)"
          [ "$PRERELEASE" = true ] && kind="Pre-release (delta build, prerelease channel)"
          codename=$(python3 -c 'import json; print(json.load(open("astra/version.json"))["codename"])')
          changes=$(python3 -c '
          import json
          for n in json.load(open("astra_device_xiaomi_sweet/release.json"))["notes"]:
              print("- " + n)')
          cat > release.md <<EOF
          **astraOS $TAG "$codename"** for the Xiaomi Redmi Note 10 Pro (sweet).

          $kind, built by the "$EVENT" event from astra $(git -C astra rev-parse --short HEAD) and astra_device_xiaomi_sweet $(git -C astra_device_xiaomi_sweet rev-parse --short HEAD).

          ### Changes

          ${changes:-- No changes since the previous build.}

          Phones on astraOS update from Settings > Software Update. The \`super.img.gz\`, \`esp.fat.gz\` and \`ota.json\` files are that update.

          Unzip, boot the phone into fastboot (Volume down + Power) and run \`flash-all.bat --wipe\` (Windows) or \`./flash-all.sh --wipe\` for a first install: it erases everything on the phone. Without \`--wipe\` it updates and keeps your data.

          <details><summary>Build verification</summary>

          \`\`\`
          $(cat astra_device_xiaomi_sweet/out/verify.txt)
          \`\`\`
          </details>
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: astraOS ${{ needs.plan.outputs.tag }} (sweet)
          body_path: release.md
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            astra_device_xiaomi_sweet/out/*.zip
            astra_device_xiaomi_sweet/out/*-super.img.gz
            astra_device_xiaomi_sweet/out/*-esp.fat.gz
            astra_device_xiaomi_sweet/out/ota.json
